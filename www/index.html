<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotina do Almoço</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mut:#6b7480;--ac:#2563eb;--bd:#e3e6ea}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1b2027;--tx:#eef1f4;--mut:#98a2ae;--ac:#5b8def;--bd:#2b323b}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:0 0 6px}
input{width:100%;box-sizing:border-box;font-size:20px;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-size:16px;padding:12px;border-radius:10px;border:0;background:var(--ac);color:#fff;width:100%;margin-top:10px}
button.o{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.step{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.step:last-of-type{border-bottom:0}.step b{font-size:28px}.step span{font-size:14px;color:var(--mut)}
#msg{font-size:14px;color:var(--mut);margin-top:10px;min-height:18px}
details summary{color:var(--mut);font-size:14px}
</style></head><body><main>
<h1>Rotina do Almoço</h1>
<p class="s">Informe a hora em que saiu para o almoço.</p>
<div class="card">
<label for="saida">Hora que bati o ponto na saída</label>
<input id="saida" type="time">
<button id="agora" class="o">Usar hora atual</button>
</div>
<div class="card" id="res" hidden>
<div class="step"><span>Começar a me arrumar</span><b id="r1"></b></div>
<div class="step"><span>Sair de casa</span><b id="r2"></b></div>
<div class="step"><span>Chegar no trabalho</span><b id="r3"></b></div>
<div class="step"><span>Bater o ponto</span><b id="r4"></b></div>
<button id="alarm">⏰ Agendar alarmes</button>
<button id="cancel" class="o">Cancelar alarmes</button>
<div id="msg"></div>
</div>
<div class="card"><details><summary>Ajustar tempos (minutos)</summary>
<div class="row" style="margin-top:12px">
<div><label for="alm">Almoço</label><input id="alm" type="number" min="0" inputmode="numeric"></div>
<div><label for="ant">Antecedência</label><input id="ant" type="number" min="0" inputmode="numeric"></div>
<div><label for="des">Deslocamento</label><input id="des" type="number" min="0" inputmode="numeric"></div>
<div><label for="arr">Me arrumar</label><input id="arr" type="number" min="0" inputmode="numeric"></div>
</div></details></div>
</main>
<script>
var D={alm:60,ant:10,des:5,arr:7},T=[],$=function(i){return document.getElementById(i)};
try{var s=JSON.parse(localStorage.getItem("rot")||"null");if(s)D=Object.assign(D,s)}catch(e){}
function f(m){m=((m%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")}
function calc(){
 ["alm","ant","des","arr"].forEach(function(k){var v=parseInt($(k).value,10);D[k]=isNaN(v)?0:v});
 try{localStorage.setItem("rot",JSON.stringify(D))}catch(e){}
 var v=$("saida").value;if(!v){$("res").hidden=true;return}
 var p=v.split(":"),s=+p[0]*60+ +p[1],ponto=s+D.alm,cheg=ponto-D.ant,sai=cheg-D.des,arr=sai-D.arr;
 T=[arr,sai,cheg,ponto];
 [$("r1"),$("r2"),$("r3"),$("r4")].forEach(function(e,i){e.textContent=f(T[i])});
 $("res").hidden=false;$("msg").textContent="";
}
var TITLES=["Hora de se arrumar","Hora de sair de casa","Chegue ao trabalho","Hora de bater o ponto"];
function LN(){return window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications}
async function agendar(){
 var ln=LN();if(!ln){$("msg").textContent="Alarmes só funcionam no app instalado.";return}
 try{
  var pr=await ln.requestPermissions();
  if(pr.display!=="granted"){$("msg").textContent="Permita as notificações para o app.";return}
  var ex=await ln.checkExactNotificationSetting();
  if(ex.exact_alarm!=="granted"){await ln.changeExactNotificationSetting();$("msg").textContent="Ative 'Alarmes e lembretes' e toque em agendar de novo.";return}
  await ln.cancel({notifications:[1,2,3,4].map(function(i){return{id:i}})});
  var now=new Date(),list=[];
  T.forEach(function(m,i){
   m=((m%1440)+1440)%1440;var d=new Date();d.setHours(Math.floor(m/60),m%60,0,0);
   if(d>now)list.push({id:i+1,title:TITLES[i],body:"São "+f(m),schedule:{at:d,allowWhileIdle:true}});
  });
  if(!list.length){$("msg").textContent="Todos os horários de hoje já passaram.";return}
  await ln.schedule({notifications:list});
  $("msg").textContent=list.length+" alarme(s) agendado(s) para hoje.";
 }catch(e){$("msg").textContent="Erro: "+e.message}
}
async function cancelar(){var ln=LN();if(!ln)return;try{await ln.cancel({notifications:[1,2,3,4].map(function(i){return{id:i}})});$("msg").textContent="Alarmes cancelados."}catch(e){}}
["alm","ant","des","arr"].forEach(function(k){$(k).value=D[k];$(k).addEventListener("input",calc)});
$("saida").addEventListener("input",calc);
$("agora").onclick=function(){var d=new Date();$("saida").value=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");calc()};
$("alarm").onclick=agendar;$("cancel").onclick=cancelar;
</script></body></html>
